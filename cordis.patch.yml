# dsh-evomem bundle patch: mounts the evomem memory tools
# (memory_remember / memory_recall / memory_forget). The backend MCP server URL
# comes from the EVOMEM_MCP_URL env var (no URL is hardcoded). The namespace is
# derived from the session's workspace folder at call time, so the model never
# sees or chooses a namespace.
- insert:
    - id: dsh-evomem
      name: dsh-evomem
